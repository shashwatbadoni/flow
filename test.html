<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Test</title>
</head>
<body>
<h2>Firebase Auth Test</h2>
<button id="btn" onclick="doSignIn()">Sign in with Google</button>
<p id="status">Loading...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

document.getElementById('status').textContent = 'Firebase loading...';

const app = initializeApp({
  apiKey: "AIzaSyAYit-D2L4WL9EGyxIoLj3XmIlnVFQWgiQ",
  authDomain: "flow-dashboard-83f95.firebaseapp.com",
  projectId: "flow-dashboard-83f95"
});

const auth = getAuth(app);
const prov = new GoogleAuthProvider();

document.getElementById('status').textContent = 'Ready! Click button to sign in.';

window.doSignIn = async () => {
  try {
    document.getElementById('status').textContent = 'Signing in...';
    await signInWithPopup(auth, prov);
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.code;
  }
};

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('status').textContent = 'Signed in as: ' + user.email;
  } else {
    document.getElementById('status').textContent = 'Not signed in. Click button above.';
  }
});
</script>
</body>
</html>
